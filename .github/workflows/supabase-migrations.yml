name: Supabase Migrations

# This workflow applies database migrations to Supabase PostgreSQL database.
# NOTE: All migrations MUST be idempotent (safe to re-run) using IF NOT EXISTS checks.
# The workflow re-applies all migrations on each run, relying on idempotency for safety.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/supabase/migrations/**'

jobs:
  run-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_DIRECT_DB_URL }}" ] && [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "ERROR: Set SUPABASE_DB_URL (or SUPABASE_DIRECT_DB_URL) in GitHub Secrets"; 
            exit 1;
          fi
      
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_DB_URL || secrets.SUPABASE_DB_URL }}
        run: |
          set -eo pipefail
          MIGRATIONS_DIR="lib/supabase/migrations"
          
          # Check if migration directory exists and contains SQL files
          if [ ! -d "$MIGRATIONS_DIR" ]; then
            echo "ERROR: Migration directory not found: $MIGRATIONS_DIR"
            exit 1
          fi
          
          # Find and apply migrations in sorted order
          shopt -s nullglob
          migrations=("$MIGRATIONS_DIR"/*.sql)
          
          if [ ${#migrations[@]} -eq 0 ]; then
            echo "No migration files found in $MIGRATIONS_DIR"
            exit 0
          fi
          
          # Sort migrations by filename
          IFS=$'\n' sorted=($(sort <<<"${migrations[*]}"))
          unset IFS
          
          for f in "${sorted[@]}"; do
            echo "Applying: $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "✔️ $f applied"
          done
      
      - name: Migration completed
        run: echo "✅ All migrations applied successfully."
