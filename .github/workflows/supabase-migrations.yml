name: Supabase Migrations

# This workflow applies database migrations to Supabase PostgreSQL database.
# NOTE: All migrations should try to be idempotent; tracking prevents re-applying already-applied files.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/supabase/migrations/**'

jobs:
  run-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_DIRECT_DB_URL }}" ] && [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "ERROR: Set SUPABASE_DB_URL (or SUPABASE_DIRECT_DB_URL) in GitHub Secrets";
            exit 1;
          fi
      
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_DB_URL || secrets.SUPABASE_DB_URL }}
        run: |
          set -eo pipefail
          MIGRATIONS_DIR="lib/supabase/migrations"
          
          # Check migration directory
          if [ ! -d "$MIGRATIONS_DIR" ]; then
            echo "ERROR: Migration directory not found: $MIGRATIONS_DIR"
            exit 1
          fi
          
          shopt -s nullglob
          migrations=("$MIGRATIONS_DIR"/*.sql)
          
          if [ ${#migrations[@]} -eq 0 ]; then
            echo "No migration files found in $MIGRATIONS_DIR"
            exit 0
          fi
          
          # Sort filenames safely
          mapfile -t sorted < <(printf '%s\n' "${migrations[@]}" | sort)
          
          # Ensure a migration tracking table exists
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS schema_migrations (
            filename TEXT PRIMARY KEY,
            applied_at TIMESTAMPTZ DEFAULT now()
          );"
          
          for f in "${sorted[@]}"; do
            filename=$(basename "$f")
            
            # Check if migration already applied (empty result is ok, connection error should fail)
            if ! already=$(psql "$DATABASE_URL" -t -A -v filename="$filename" -c "SELECT 1 FROM schema_migrations WHERE filename = :'filename';"); then
              echo "ERROR: Failed to query schema_migrations table"
              exit 1
            fi
            
            if [ -n "$already" ] && [ "$already" = "1" ]; then
              echo "Skipping already-applied migration: $filename"
              continue
            fi

            echo "Applying: $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            # Only record after success
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v filename="$filename" -c "INSERT INTO schema_migrations(filename) VALUES (:'filename');"
            echo "✔️ $f applied and recorded"
          done
      
      - name: Migration completed
        run: echo "✅ All migrations applied successfully."
